name: build-windows-exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PySide6 pypdf

      - name: Build onefile exe
        run: |
          if (-not (Test-Path "brand.json")) { Copy-Item "brand.example.json" "brand.json" }
          pyinstaller --onefile --noconfirm --clean `
            --name ClyveIDE `
            --add-data "web;web" `
            --add-data "brand.json;." `
            --collect-submodules clyve_ide `
            --exclude-module tkinter `
            app.py

      - name: Smoke test (UI + API respond)
        shell: pwsh
        run: |
          $env:CLYVE_API_KEY = ""
          $p = Start-Process -FilePath "dist\ClyveIDE.exe" -ArgumentList "--no-window","--port","8931" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8931/api/state" -TimeoutSec 3
              if ($r.StatusCode -eq 200 -and $r.Content -match "has_key") { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "exe tidak merespons /api/state" }
          Write-Host "smoke test OK"

      - uses: actions/upload-artifact@v4
        with:
          name: ClyveIDE-windows
          path: dist/ClyveIDE.exe
          if-no-files-found: error
